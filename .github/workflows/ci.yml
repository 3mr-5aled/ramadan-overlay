name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build library bundles
        run: npm run build

      - name: Build demo showcase
        run: npm run build:demo

      - name: Run test suite
        run: npm run test

      - name: Verify build artifacts
        run: |
          test -d dist && test -f dist/index.js && test -f dist/index.cjs && test -f dist/ramadan-overlay.min.js
          test -d dist-demo && test -f dist-demo/index.html
          echo "All production and demo build artifacts verified successfully."
